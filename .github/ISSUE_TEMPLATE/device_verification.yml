name: Device verification
description: Report a successful or failed real-device CoreDevice / refresh compatibility test
title: "[Device]: "
body:
  - type: markdown
    attributes:
      value: |
        The current proof device has completed a full PC-free scheduled refresh. Additional real-device reports are used to map compatibility across iPhone/iPad models, iOS versions, and Wi-Fi network ranges.

        Do not upload pairing files, private keys, Apple credentials, signed personal IPAs, exact private network addresses if you do not want to disclose them, or unredacted private device logs.

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 12
    validations:
      required: true

  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: iOS 26.6.1
    validations:
      required: true

  - type: dropdown
    id: network_family
    attributes:
      label: Wi-Fi IPv4 network family
      description: Exact private IP addresses are not needed.
      options:
        - 10.x private range
        - 192.168.x private range
        - 172.16-31.x private range
        - Other IPv4 range
        - Prefer not to disclose
    validations:
      required: true

  - type: dropdown
    id: localdevvpn_route
    attributes:
      label: LocalDevVPN same-subnet /32 configuration
      options:
        - Configured and connected
        - Configured but LocalDevVPN would not stay connected
        - Could not configure successfully
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: manual
    attributes:
      label: Manual Refresh All over CoreDevice
      options:
        - Success
        - Failed
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: pc
    attributes:
      label: Was the PC/USB disconnected during the scheduled test?
      options:
        - Yes
        - No
        - Scheduled execution not tested
    validations:
      required: true

  - type: dropdown
    id: scheduled
    attributes:
      label: Native scheduled refresh result
      options:
        - Triggered and completed successfully
        - Triggered but failed
        - Request was scheduled but did not trigger yet
        - Not tested
    validations:
      required: true

  - type: textarea
    id: markers
    attributes:
      label: Non-sensitive evidence
      description: For a full autonomous success, include the relevant redacted TRIGGER, AUTH_PREFLIGHT_PASS, OPERATION_START, and COMPLETE success=true markers.
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Include LocalDevVPN behavior, refreshed apps, expiration-date result, route/setup observations, and anything unusual.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed this report contains no pairing records, private keys, Apple credentials, signed personal IPAs, or unnecessary device identifiers.
          required: true
