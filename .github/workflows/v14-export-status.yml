name: Export v14 artifact status

on:
  push:
    branches: [v14-protocol-matrix]
    paths:
      - ".github/v14-export-trigger"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "v14 protocol-matrix head SHA"
        required: false

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v14-protocol-matrix
          fetch-depth: 0

      - name: Resolve exact v14 run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha || 'c5ac14f7c2788976ca481c154b771a1f144ad86b' }}
        run: |
          set -euo pipefail
          mkdir -p build-results
          runs_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/v14-protocol-matrix.yml/runs" \
            -f branch=v14-protocol-matrix \
            -f per_page=20)"

          run_id="$(jq -r --arg sha "$TARGET_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha) | .id' \
            <<<"$runs_json" | head -1)"
          status="$(jq -r --arg sha "$TARGET_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha) | .status' \
            <<<"$runs_json" | head -1)"
          conclusion="$(jq -r --arg sha "$TARGET_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha) | (.conclusion // "")' \
            <<<"$runs_json" | head -1)"

          artifact_id=""
          artifact_digest=""
          if [[ -n "$run_id" && "$status" == "completed" && "$conclusion" == "success" ]]; then
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact_id="$(jq -r '.artifacts[] | select(.name == "SideStore-v14-protocol-matrix") | .id' <<<"$artifacts_json" | head -1)"
            artifact_digest="$(jq -r '.artifacts[] | select(.name == "SideStore-v14-protocol-matrix") | (.digest // "")' <<<"$artifacts_json" | head -1)"
          fi

          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "RUN_ID=$run_id"
            echo "STATUS=$status"
            echo "CONCLUSION=$conclusion"
            echo "ARTIFACT_ID=$artifact_id"
            echo "ARTIFACT_DIGEST=$artifact_digest"
            echo "EXPORTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-results/v14-latest.env
          cat build-results/v14-latest.env

      - name: Commit status file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-results/v14-latest.env
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record v14 protocol-matrix artifact status"
          git push origin HEAD:v14-protocol-matrix
