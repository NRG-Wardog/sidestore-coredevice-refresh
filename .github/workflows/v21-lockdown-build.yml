name: Build SideStore v21 Adaptive CoreDevice/RP

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_V21 to authorize the single final macOS build
        required: true
        type: string
  push:
    branches:
      - v21-lockdown-first
    paths:
      - .github/v21-adaptive-build-now

permissions:
  contents: read

concurrency:
  group: sidestore-v21-adaptive-final
  cancel-in-progress: false

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'BUILD_V21' }}
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout diagnostic builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1

      - name: Checkout pinned SideStore and submodules
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          path: work/SideStore
          fetch-depth: 1
          submodules: recursive

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore existing SwiftPM download cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: sidestore-v21-adaptive-spm-${{ runner.os }}-${{ env.SIDESTORE_REF }}-${{ env.MINIMUXER_REF }}
          restore-keys: |
            sidestore-v20-spm-${{ runner.os }}-
            sidestore-v19-spm-${{ runner.os }}-
            sidestore-v18-spm-${{ runner.os }}-
            sidestore-

      - name: Patch and validate source without building
        env:
          MODE: prepare
          BUILDER: ${{ github.workspace }}/builder
          SIDESTORE_DIR: ${{ github.workspace }}/work/SideStore
        run: bash builder/scripts/v21_ci.sh

      - name: Build exactly once and verify IPA
        env:
          MODE: build
          BUILDER: ${{ github.workspace }}/builder
          SIDESTORE_DIR: ${{ github.workspace }}/work/SideStore
        run: bash builder/scripts/v21_ci.sh

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v21-adaptive
          path: |
            work/SideStore/SideStore.ipa
            /tmp/v21-source-gate.txt
            /tmp/v21-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics only when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v21-adaptive-failure-diagnostics
          path: |
            work/SideStore/build/logs
            /tmp/v21-source-gate.txt
            /tmp/v21-unzip-test.txt
            /tmp/v21-embedded-strings.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
