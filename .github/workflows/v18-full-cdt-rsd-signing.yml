name: Build SideStore v18 Full CDTunnel RSD Signing

on:
  workflow_dispatch:
  push:
    branches: [v18-full-cdt-rsd-signing]
    paths:
      - ".github/v18-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v18-full-cdt-rsd-signing
  cancel-in-progress: false

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: 7b9d269ec64027d73a50faa917cb18fa218c1fc9

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
      - name: Verify v18 patch syntax and invariants
        run: |
          python3 -m py_compile builder/scripts/patch_v18_full_pipeline.py
          python3 -m py_compile builder/scripts/patch_v18_ci_inject.py
          grep -Fq 'REQUEST_WIRE_PARITY=pymobiledevice3-json-dumps' builder/scripts/patch_v18_full_pipeline.py
          grep -Fq '[SS-V18-TLS] ALERT' builder/scripts/patch_v18_full_pipeline.py
          grep -Fq '[SS-V18-RSD] VALIDATION_PASS' builder/scripts/patch_v18_full_pipeline.py
      - name: Verify pinned RemotePairingKit product graph
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mahee96/RemotePairingKit/${RPK_REF}/Package.swift" -o /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "RPPairing"' /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "OpenSSL"' /tmp/RemotePairingKit.Package.swift
      - name: Build v18 CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          bash -n /tmp/v18_ci.sh
      - name: Run Linux source, Rust, Swift and privacy barriers
        env:
          MODE: preflight
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v18_ci.sh
          bash /tmp/v18_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-v18-preflight
          path: /tmp/v14-local-tests.txt
          if-no-files-found: error

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Build v18 CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          bash -n /tmp/v18_ci.sh
      - name: Build native libraries and SideStore v18 IPA
        env:
          MODE: build
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v18_ci.sh
          bash /tmp/v18_ci.sh
          grep -Fq '[EMP-RECOVER] UDP socket rebound after ENOTCONN' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V18-CDT] REQUEST_WRITE_PASS' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V18-TLS] RX_RECORD' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V18-TLS] ALERT' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V18-TLS] APP_DECRYPT_PASS' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V18-RSD] VALIDATION_PASS' /tmp/v14-embedded-strings.txt
          grep -Fq '[SS-V17-RSD] HANDSHAKE_PASS' /tmp/v14-embedded-strings.txt
          grep -Fq 'FLAG: READY_TO_AUTOMATION' /tmp/v14-embedded-strings.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-v18-full-cdt-rsd-signing
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/SideStore.ipa
            /tmp/SideStore-v14-verification.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v18-build-diagnostics
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/build/logs
            /tmp/v14-unzip-test.txt
            /tmp/v14-embedded-strings.txt
          if-no-files-found: ignore
