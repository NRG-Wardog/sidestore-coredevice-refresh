name: Build SideStore Dynamic-Tunnel Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout diagnostic builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout SideStore idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
          submodules: recursive
          path: idevice

      - name: Apply diagnostic retry patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("idevice/ffi/src/tunnel_provider.rs")
          s = p.read_text()

          old = '''    let tunnel_port = rpc.create_tcp_listener().await?;
              let mut tunnel_addr = connect_addr;
              tunnel_addr.set_port(tunnel_port);
              let tunnel_stream = run_global_timeout(|| tokio::net::TcpStream::connect(tunnel_addr))
                  .await
                  .map_err(|e| IdeviceError::InternalError(format!("TLS tunnel: {e}")))?;
              let tunnel = connect_tls_psk_tunnel_native(tunnel_stream, rpc.encryption_key()).await?;'''

          # Normalize indentation of the literal above to the actual four-space Rust indentation.
          old = old.replace("              ", "    ")

          new = '''    let tunnel_port = rpc.create_tcp_listener().await?;
              let mut tunnel_addr = connect_addr;
              tunnel_addr.set_port(tunnel_port);

              tracing::error!(
                  "[SS-DIAG] create_tcp_listener returned port={} target={}",
                  tunnel_port,
                  tunnel_addr
              );

              let mut tunnel_stream = None;
              let mut connected_attempt: Option<u32> = None;
              let mut last_error = String::from("no attempt made");

              for attempt in 1..=12u32 {
                  tracing::error!(
                      "[SS-DIAG] dynamic TCP connect attempt {}/12 -> {}",
                      attempt,
                      tunnel_addr
                  );

                  match tokio::time::timeout(
                      std::time::Duration::from_millis(250),
                      tokio::net::TcpStream::connect(tunnel_addr),
                  )
                  .await
                  {
                      Ok(Ok(stream)) => {
                          tracing::error!(
                              "[SS-DIAG] dynamic TCP CONNECTED on attempt {} -> {}",
                              attempt,
                              tunnel_addr
                          );
                          connected_attempt = Some(attempt);
                          tunnel_stream = Some(stream);
                          break;
                      }
                      Ok(Err(e)) => {
                          last_error = format!("socket error: {e}");
                          tracing::error!(
                              "[SS-DIAG] attempt {} socket error: {}",
                              attempt,
                              e
                          );
                      }
                      Err(_) => {
                          last_error = String::from("250ms per-attempt timeout");
                          tracing::error!(
                              "[SS-DIAG] attempt {} timed out after 250ms",
                              attempt
                          );
                      }
                  }

                  tokio::time::sleep(std::time::Duration::from_millis(100)).await;
              }

              let tunnel_stream = tunnel_stream.ok_or_else(|| {
                  IdeviceError::InternalError(format!(
                      "[SS-DIAG] dynamic TCP failed: target={tunnel_addr}, port={tunnel_port}, attempts=12, last={last_error}"
                  ))
              })?;
              let connected_attempt = connected_attempt.unwrap_or(0);

              tracing::error!(
                  "[SS-DIAG] starting TLS-PSK handshake on {} after TCP attempt {}",
                  tunnel_addr,
                  connected_attempt
              );

              let tunnel = match connect_tls_psk_tunnel_native(tunnel_stream, rpc.encryption_key()).await {
                  Ok(tunnel) => {
                      tracing::error!(
                          "[SS-DIAG] TLS-PSK/CDTunnel handshake SUCCESS on {} after TCP attempt {}",
                          tunnel_addr,
                          connected_attempt
                      );
                      tunnel
                  }
                  Err(e) => {
                      return Err(IdeviceError::InternalError(format!(
                          "[SS-DIAG] TLS-PSK/CDTunnel failed: target={tunnel_addr}, port={tunnel_port}, connected_attempt={connected_attempt}, error={e:?}"
                      )));
                  }
              };'''

          new = new.replace("              ", "    ")

          if old not in s:
              marker = "let tunnel_port = rpc.create_tcp_listener().await?;"
              idx = s.find(marker)
              if idx >= 0:
                  print(s[max(0, idx-200):idx+1000])
              raise SystemExit("Could not locate stock finish_tunnel block")

          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Diagnostic patch applied")
          PY

          grep -n "SS-DIAG" idevice/ffi/src/tunnel_provider.rs

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install build tools
        run: |
          brew install just ldid xcbeautify
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add aarch64-apple-tvos
          rustup target add aarch64-apple-tvos-sim
          rustup target add aarch64-apple-darwin
          cargo install --force --locked bindgen-cli

      - name: Build patched IDevice XCFramework
        working-directory: idevice
        run: |
          just xcframework
          test -d swift/IDevice.xcframework
          test -f swift/bundle.zip

      - name: Checkout exact SideStore Nightly source
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: f3a18d61efae65b05dc935fff75b89225efdb0ff
          submodules: recursive
          fetch-depth: 0
          path: SideStore

      - name: Inject patched IDevice into minimuxer
        run: |
          mkdir -p SideStore/Dependencies/minimuxer/DeviceGateway/LocalBinary
          cp -R idevice/swift/IDevice.xcframework SideStore/Dependencies/minimuxer/DeviceGateway/LocalBinary/IDevice.xcframework

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("SideStore/Dependencies/minimuxer/DeviceGateway/Package.swift")
          s = p.read_text()

          pattern = re.compile(
              r'(?ms)\s*\.binaryTarget\(\s*'
              r'name:\s*"IDevice",\s*'
              r'url:\s*"https://github\.com/SideStore/idevice/releases/download/[^"]+",\s*'
              r'checksum:\s*"[0-9a-f]+"\s*'
              r'\),'
          )

          replacement = "\n             .binaryTarget(\n                 name: \"IDevice\",\n                 path: \"LocalBinary/IDevice.xcframework\"\n             ),"

          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not replace remote IDevice binaryTarget")

          p.write_text(s2)
          print("Patched Package.swift to use local diagnostic IDevice XCFramework")
          PY

          grep -n -A4 -B2 'name: "IDevice"' SideStore/Dependencies/minimuxer/DeviceGateway/Package.swift

      - name: Clear SwiftPM artifact cache
        run: |
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"

      - name: Build diagnostic SideStore IPA
        working-directory: SideStore
        run: |
          python3 scripts/ci/workflow.py build

      - name: Verify IPA exists
        run: |
          test -f SideStore/SideStore.ipa
          ls -lh SideStore/SideStore.ipa

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-dynamic-tunnel-diag
          path: SideStore/SideStore.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-dynamic-tunnel-diag-build-logs
          path: SideStore/build/logs
          if-no-files-found: ignore
