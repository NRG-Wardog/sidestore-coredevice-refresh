name: Build SideStore Dynamic-Tunnel Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native-diag:
    name: Build patched IDevice + EMProxy (iOS only)
    runs-on: macos-26

    steps:
      - name: Checkout diagnostic builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact SideStore idevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
          submodules: recursive
          path: idevice

      - name: Checkout exact SideStore EMProxy v0.9.3
        uses: actions/checkout@v4
        with:
          repository: SideStore/em_proxy
          ref: 6e117e140ca7cff4ff106bdefa18147552a0e592
          path: em_proxy

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install Rust build prerequisites
        run: |
          rustup target add aarch64-apple-ios
          cargo install --force --locked bindgen-cli

      - name: Apply IDevice dynamic-tunnel diagnostic patch
        run: |
          python3 builder/scripts/apply_diag_patch.py idevice/ffi/src/tunnel_provider.rs
          grep -n "SS-DIAG" idevice/ffi/src/tunnel_provider.rs

      - name: Build iOS arm64 IDevice XCFramework
        working-directory: idevice
        run: |
          set -euo pipefail

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            cargo build --release --target aarch64-apple-ios --features obfuscate \
            --manifest-path ffi/Cargo.toml

          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h

          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h

          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include \
            -output swift/IDevice.xcframework

          test -d swift/IDevice.xcframework
          (cd swift && zip -qry ../IDevice.xcframework.zip IDevice.xcframework)
          shasum -a 256 IDevice.xcframework.zip

      - name: Apply EMProxy TCP packet diagnostic patch
        run: |
          python3 builder/scripts/apply_emproxy_diag.py em_proxy/src/lib.rs
          grep -n "EMP-DIAG" em_proxy/src/lib.rs

      - name: Build iOS arm64 EMProxy XCFramework
        working-directory: em_proxy
        run: |
          set -euo pipefail

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --release --target aarch64-apple-ios

          test -f target/aarch64-apple-ios/release/libem_proxy.a
          test -f include/EMProxy/em_proxy.h

          rm -rf libs/EMProxy.xcframework
          mkdir -p libs
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libem_proxy.a \
            -headers include \
            -output libs/EMProxy.xcframework

          test -d libs/EMProxy.xcframework
          (cd libs && zip -qry ../EMProxy.xcframework.zip EMProxy.xcframework)
          shasum -a 256 EMProxy.xcframework.zip

      - name: Upload patched native diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Patched-native-iOS
          path: |
            idevice/IDevice.xcframework.zip
            em_proxy/EMProxy.xcframework.zip
          if-no-files-found: error

  build-sidestore:
    name: Build diagnostic SideStore IPA
    needs: build-native-diag
    runs-on: macos-26

    steps:
      - name: Checkout diagnostic builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact SideStore Nightly source
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: f3a18d61efae65b05dc935fff75b89225efdb0ff
          submodules: recursive
          fetch-depth: 0
          path: SideStore

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install SideStore build tools
        run: |
          brew install ldid xcbeautify

      - name: Download patched native diagnostics
        uses: actions/download-artifact@v4
        with:
          name: Patched-native-iOS
          path: patched-native

      - name: Inject local IDevice, EMProxy and OpenSSL
        run: |
          set -euo pipefail

          mkdir -p patched-native/idevice patched-native/emproxy
          unzip -q patched-native/idevice/IDevice.xcframework.zip -d patched-native/idevice/unpacked 2>/dev/null || \
            unzip -q patched-native/IDevice.xcframework.zip -d patched-native/idevice/unpacked
          unzip -q patched-native/em_proxy/EMProxy.xcframework.zip -d patched-native/emproxy/unpacked 2>/dev/null || \
            unzip -q patched-native/EMProxy.xcframework.zip -d patched-native/emproxy/unpacked

          test -d patched-native/idevice/unpacked/IDevice.xcframework
          test -d patched-native/emproxy/unpacked/EMProxy.xcframework

          DEVICE_LOCAL="SideStore/Dependencies/minimuxer/DeviceGateway/LocalBinary"
          MINIMUXER_LOCAL="SideStore/Dependencies/minimuxer/LocalBinary"
          mkdir -p "$DEVICE_LOCAL" "$MINIMUXER_LOCAL"
          cp -R patched-native/idevice/unpacked/IDevice.xcframework "$DEVICE_LOCAL/IDevice.xcframework"
          cp -R patched-native/emproxy/unpacked/EMProxy.xcframework "$MINIMUXER_LOCAL/EMProxy.xcframework"

          OPENSSL_ZIP="/tmp/OpenSSL.xcframework.zip"
          OPENSSL_DIR="/tmp/openssl-xcframework"
          rm -rf "$OPENSSL_DIR"
          mkdir -p "$OPENSSL_DIR"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" \
            --output "$OPENSSL_ZIP"

          printf '%s  %s\n' \
            "37846a8bd302cb2443eff47f1045ab844d0cd40bf82cc6159cfad9aa5c3eff9e" \
            "$OPENSSL_ZIP" | shasum -a 256 -c -

          unzip -q "$OPENSSL_ZIP" -d "$OPENSSL_DIR"
          FOUND_OPENSSL="$(find "$OPENSSL_DIR" -type d -name OpenSSL.xcframework -print -quit)"
          test -n "$FOUND_OPENSSL"
          cp -R "$FOUND_OPENSSL" "$DEVICE_LOCAL/OpenSSL.xcframework"

          python3 builder/scripts/patch_devicegateway_package.py \
            SideStore/Dependencies/minimuxer/DeviceGateway/Package.swift
          python3 builder/scripts/patch_minimuxer_package.py \
            SideStore/Dependencies/minimuxer/Package.swift

          grep -n -A4 -B1 'name: "IDevice"' SideStore/Dependencies/minimuxer/DeviceGateway/Package.swift
          grep -n -A4 -B1 'name: "OpenSSL"' SideStore/Dependencies/minimuxer/DeviceGateway/Package.swift
          grep -n -A4 -B1 'name: "EMProxy"' SideStore/Dependencies/minimuxer/Package.swift

      - name: Apply DeviceGateway downstream diagnostics
        run: |
          python3 builder/scripts/apply_gateway_diag.py \
            SideStore/Dependencies/minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          grep -n "GW-DIAG" SideStore/Dependencies/minimuxer/DeviceGateway/idevice/IdeviceGateway.swift

      - name: Resolve Swift packages with clean artifact cache
        working-directory: SideStore
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm"

            if xcodebuild -resolvePackageDependencies \
              -project AltStore.xcodeproj \
              -scheme SideStore; then
              echo "Package resolution succeeded on attempt $attempt"
              exit 0
            fi

            echo "Package resolution attempt $attempt failed; clearing cache before retry"
            sleep 2
          done

          exit 1

      - name: Build diagnostic SideStore IPA
        working-directory: SideStore
        run: |
          python3 scripts/ci/workflow.py build

      - name: Verify IPA exists
        run: |
          test -f SideStore/SideStore.ipa
          ls -lh SideStore/SideStore.ipa

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-dynamic-tunnel-packet-diag
          path: SideStore/SideStore.ipa
          if-no-files-found: error

      - name: Upload SideStore build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-dynamic-tunnel-packet-diag-build-logs
          path: SideStore/build/logs
          if-no-files-found: ignore
