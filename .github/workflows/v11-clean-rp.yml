name: Build SideStore v11 Clean RemotePairingKit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/v11-clean-rp-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v11-clean-rp
  cancel-in-progress: false

env:
  SIDESTORE_REF: f3a18d61efae65b05dc935fff75b89225efdb0ff
  MINIMUXER_REF: 71b957efc65e4687a94b1f1dac27fb3344c22936
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: e72cd0272ab7b4548b5cd22ed4a81008b2b52717

jobs:
  preflight:
    name: Verify clean RP architecture on exact sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact minimuxer
        uses: actions/checkout@v4
        with:
          repository: SideStore/minimuxer
          ref: ${{ env.MINIMUXER_REF }}
          path: minimuxer

      - name: Checkout exact EMProxy
        uses: actions/checkout@v4
        with:
          repository: SideStore/em_proxy
          ref: ${{ env.EMPROXY_REF }}
          path: em_proxy

      - name: Run clean-v11 structural and idempotence suite
        run: |
          set -euo pipefail
          python3 builder/tests/run_v11_clean_local_tests.py builder minimuxer em_proxy

      - name: Verify Swift package manifests parse
        run: |
          set -euo pipefail
          swift package --package-path minimuxer dump-package >/tmp/minimuxer-package.json
          swift package --package-path minimuxer/DeviceGateway dump-package >/tmp/gateway-package.json
          grep -q 'LibimobiledeviceGateway' /tmp/gateway-package.json
          grep -q 'e72cd0272ab7b4548b5cd22ed4a81008b2b52717' minimuxer/DeviceGateway/Package.swift

      - name: Compile-check patched EMProxy
        working-directory: em_proxy
        run: |
          set -euo pipefail
          cargo check --locked --lib

      - name: Hard fail if legacy transport leaked in
        run: |
          set -euo pipefail
          ! grep -R -E 'SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT|SS-SOURCE-BOUND' \
            minimuxer/Sources/MinimuxerApi.swift \
            minimuxer/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift
          ! grep -E 'LocalBinary/(IDevice|OpenSSL)\.xcframework' minimuxer/DeviceGateway/Package.swift
          ! grep -E 'EMP-NAT46|EMP-HAIRPIN' em_proxy/src/lib.rs

  build-emproxy:
    name: Build only fixed EMProxy iOS binary
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact EMProxy
        uses: actions/checkout@v4
        with:
          repository: SideStore/em_proxy
          ref: ${{ env.EMPROXY_REF }}
          path: em_proxy

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Apply nonblocking fix and build EMProxy
        working-directory: em_proxy
        run: |
          set -euo pipefail
          python3 ../builder/scripts/apply_emproxy_diag.py src/lib.rs
          grep -q 'EMP-NONBLOCK' src/lib.rs
          ! grep -E 'EMP-NAT46|EMP-HAIRPIN|Unable to set UDP timeout|Rebinding to socket' src/lib.rs

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --release --target aarch64-apple-ios

          test -f target/aarch64-apple-ios/release/libem_proxy.a
          rm -rf libs/EMProxy.xcframework EMProxy.xcframework.zip
          mkdir -p libs
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libem_proxy.a \
            -headers include \
            -output libs/EMProxy.xcframework
          (cd libs && zip -qry ../EMProxy.xcframework.zip EMProxy.xcframework)
          shasum -a 256 EMProxy.xcframework.zip

      - name: Upload clean EMProxy
        uses: actions/upload-artifact@v4
        with:
          name: V11-Clean-EMProxy-iOS
          path: em_proxy/EMProxy.xcframework.zip
          if-no-files-found: error

  build-sidestore:
    name: Build SideStore v11 clean RP IPA
    needs: build-emproxy
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact SideStore with pinned minimuxer submodule
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: SideStore

      - name: Verify exact minimuxer submodule
        working-directory: SideStore
        run: |
          set -euo pipefail
          actual="$(git -C Dependencies/minimuxer rev-parse HEAD)"
          echo "minimuxer=$actual"
          test "$actual" = "$MINIMUXER_REF"

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install SideStore build tools
        run: brew install ldid xcbeautify

      - name: Download fixed EMProxy
        uses: actions/download-artifact@v4
        with:
          name: V11-Clean-EMProxy-iOS
          path: patched-native/emproxy

      - name: Inject EMProxy and patch clean RP backend
        run: |
          set -euo pipefail
          unzip -q patched-native/emproxy/EMProxy.xcframework.zip -d patched-native/emproxy/unpacked
          test -d patched-native/emproxy/unpacked/EMProxy.xcframework
          LOCAL="SideStore/Dependencies/minimuxer/LocalBinary"
          rm -rf "$LOCAL/EMProxy.xcframework"
          mkdir -p "$LOCAL"
          cp -R patched-native/emproxy/unpacked/EMProxy.xcframework "$LOCAL/EMProxy.xcframework"

          MUX="SideStore/Dependencies/minimuxer"
          python3 builder/scripts/patch_v11_clean_backend.py "$MUX/Sources/MinimuxerApi.swift"
          python3 builder/scripts/patch_v11_clean_libimobile.py "$MUX/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift"
          python3 builder/scripts/patch_v11_clean_packages.py "$MUX"

          python3 builder/scripts/apply_boot_transport_fix.py SideStore/SideStore/AppBootManager.swift
          python3 builder/scripts/apply_background_auth_gate.py SideStore/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift

      - name: Verify runtime architecture before SwiftPM
        run: |
          set -euo pipefail
          MUX="SideStore/Dependencies/minimuxer"
          grep -q 'currentBackend: GatewayBackend = .libimobiledevice' "$MUX/Sources/MinimuxerApi.swift"
          grep -q 'let resolvedBackend: GatewayBackend = .libimobiledevice' "$MUX/Sources/MinimuxerApi.swift"
          grep -q 'SS-V11-CLEAN-RP' "$MUX/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift"
          grep -q 'STRICT_UDID_QUERY_SUCCESS' "$MUX/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift"
          grep -q 'DYNAMIC_CONNECT_SUCCESS' "$MUX/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift"
          grep -q 'e72cd0272ab7b4548b5cd22ed4a81008b2b52717' "$MUX/DeviceGateway/Package.swift"
          grep -q 'path: "LocalBinary/EMProxy.xcframework"' "$MUX/Package.swift"
          test -d "$MUX/LocalBinary/EMProxy.xcframework"

          ! grep -E 'LocalBinary/(IDevice|OpenSSL)\.xcframework' "$MUX/DeviceGateway/Package.swift"
          ! grep -E 'SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT|SS-SOURCE-BOUND' \
            "$MUX/Sources/MinimuxerApi.swift" \
            "$MUX/DeviceGateway/libimobiledevice/LibimobiledeviceGateway.swift"

      - name: Resolve Swift packages with clean cache
        working-directory: SideStore
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
            if xcodebuild -resolvePackageDependencies -project AltStore.xcodeproj -scheme SideStore; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build SideStore v11 clean RP
        working-directory: SideStore
        run: |
          set -euo pipefail
          python3 scripts/ci/workflow.py build

      - name: Verify IPA
        run: |
          set -euo pipefail
          test -f SideStore/SideStore.ipa
          ls -lh SideStore/SideStore.ipa
          shasum -a 256 SideStore/SideStore.ipa

      - name: Upload v11 clean RP IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v11-clean-rp
          path: SideStore/SideStore.ipa
          if-no-files-found: error

      - name: Upload v11 clean RP build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v11-clean-rp-build-logs
          path: SideStore/build/logs
          if-no-files-found: ignore
