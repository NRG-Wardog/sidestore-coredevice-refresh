name: Build SideStore v19 NAT44 Dynamic Listener

on:
  workflow_dispatch:
  push:
    branches: [v19-nat44-dynamic]
    paths:
      - ".github/v19-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v19-nat44-dynamic
  cancel-in-progress: true

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: 7b9d269ec64027d73a50faa917cb18fa218c1fc9

jobs:
  preflight:
    name: fast-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - name: Validate v19 generators and packet model
        run: |
          python3 -m py_compile \
            builder/scripts/patch_v15_ci_inject.py \
            builder/scripts/patch_v18_ci_inject.py \
            builder/scripts/patch_v18_full_pipeline.py \
            builder/scripts/patch_v19_ci_inject.py \
            builder/scripts/apply_emproxy_nat44_dynamic.py \
            builder/tests/test_nat44_packet_model.py
          python3 builder/tests/test_nat44_packet_model.py
          grep -Fq '[EMP-NAT44] dynamic listener bridge active' builder/scripts/apply_emproxy_nat44_dynamic.py
          grep -Fq 'new mapping requires initiating SYN' builder/scripts/apply_emproxy_nat44_dynamic.py
          grep -Fq 'NAT44_CONTROL_PORT' builder/scripts/apply_emproxy_nat44_dynamic.py
          grep -Fq 'NAT44_LOCKDOWN_PORT' builder/scripts/apply_emproxy_nat44_dynamic.py

      - name: Verify pinned RemotePairingKit product graph
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mahee96/RemotePairingKit/${RPK_REF}/Package.swift" -o /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "RPPairing"' /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "OpenSSL"' /tmp/RemotePairingKit.Package.swift

      - name: Generate final CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          python3 builder/scripts/patch_v19_ci_inject.py /tmp/v18_ci.sh /tmp/v19_ci.sh
          bash -n /tmp/v19_ci.sh

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/sidestore-v19-fast-preflight-target
          key: sidestore-v19-linux-${{ hashFiles('builder/scripts/*.py', 'builder/scripts/v14_ci.sh', 'builder/tests/test_nat44_packet_model.py') }}
          restore-keys: |
            sidestore-v19-linux-

      - name: Apply every patch and compile changed EMProxy crate
        env:
          MODE: preflight
          FAST_PREFLIGHT: "1"
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v19_ci.sh
          bash /tmp/v19_ci.sh

  build:
    name: final-macos-build
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: sidestore-v19-${{ runner.os }}-${{ runner.arch }}-xcode26.4-${{ hashFiles('builder/scripts/*.py', 'builder/scripts/v14_ci.sh') }}
          restore-keys: |
            sidestore-v19-${{ runner.os }}-${{ runner.arch }}-xcode26.4-

      - name: Generate final CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          python3 builder/scripts/patch_v19_ci_inject.py /tmp/v18_ci.sh /tmp/v19_ci.sh
          bash -n /tmp/v19_ci.sh

      - name: Build native libraries and SideStore v19 IPA
        env:
          MODE: build
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v19_ci.sh
          bash /tmp/v19_ci.sh

      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SideStore-v19-nat44-dynamic
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/SideStore.ipa
            /tmp/SideStore-v14-verification.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v19-build-failure-diagnostics
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/build/logs
            /tmp/v14-unzip-test.txt
            /tmp/v14-embedded-strings.txt
          if-no-files-found: ignore
          retention-days: 3
