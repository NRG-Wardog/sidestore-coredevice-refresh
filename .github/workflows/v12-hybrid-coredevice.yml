name: Build SideStore v12 Hybrid CoreDeviceProxy

on:
  workflow_dispatch:
  push:
    branches: [v12-hybrid-coredevice]
    paths:
      - ".github/v12-hybrid-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v12-hybrid-coredevice
  cancel-in-progress: false

env:
  SIDESTORE_REF: f3a18d61efae65b05dc935fff75b89225efdb0ff
  MINIMUXER_REF: 71b957efc65e4687a94b1f1dac27fb3344c22936
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: e72cd0272ab7b4548b5cd22ed4a81008b2b52717

jobs:
  preflight:
    name: Verify v12 architecture and fail-closed patch suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v12 builder branch
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact minimuxer
        uses: actions/checkout@v4
        with:
          repository: SideStore/minimuxer
          ref: ${{ env.MINIMUXER_REF }}
          path: minimuxer

      - name: Checkout exact IDevice source contract
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice

      - name: Checkout exact EMProxy
        uses: actions/checkout@v4
        with:
          repository: SideStore/em_proxy
          ref: ${{ env.EMPROXY_REF }}
          path: em_proxy

      - name: Checkout exact SideStore source
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          submodules: false
          path: SideStore

      - name: Verify exact source revisions
        run: |
          set -euo pipefail
          test "$(git -C minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          test "$(git -C em_proxy rev-parse HEAD)" = "$EMPROXY_REF"
          test "$(git -C SideStore rev-parse HEAD)" = "$SIDESTORE_REF"

      - name: Run v12 structural, idempotence, ownership, and negative tests
        run: |
          set -euo pipefail
          python3 builder/tests/run_v12_hybrid_local_tests.py \
            builder minimuxer em_proxy idevice SideStore | tee /tmp/v12-local-tests.txt

      - name: Apply v12 patches to exact checkout for parser checks
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_v12_hybrid_backend.py minimuxer/Sources/MinimuxerApi.swift
          python3 builder/scripts/patch_v12_hybrid_idevice.py minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          python3 builder/scripts/patch_v12_packages.py minimuxer
          python3 builder/scripts/apply_emproxy_diag.py em_proxy/src/lib.rs

      - name: Parse patched Swift and package manifests
        run: |
          set -euo pipefail
          swiftc -frontend -parse minimuxer/Sources/MinimuxerApi.swift
          swiftc -frontend -parse minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          swiftc -frontend -parse minimuxer/Sources/Services/NetworkObserverService.swift
          swift package --package-path minimuxer dump-package >/tmp/minimuxer-package.json
          swift package --package-path minimuxer/DeviceGateway dump-package >/tmp/gateway-package.json
          grep -q 'IdeviceGateway' /tmp/gateway-package.json
          grep -q 'v0.1.66-ss-61c2704' minimuxer/DeviceGateway/Package.swift

      - name: Compile-check fixed EMProxy
        working-directory: em_proxy
        run: |
          set -euo pipefail
          cargo check --locked --lib

      - name: Hard architecture barriers
        run: |
          set -euo pipefail
          GATEWAY=minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          API=minimuxer/Sources/MinimuxerApi.swift
          grep -q 'HYBRID_FILE has_rp=' "$GATEWAY"
          grep -q 'LOCKDOWN_SESSION_AND_COREDEVICE_START' "$GATEWAY"
          grep -q 'COREDEVICE_TUNNEL_SUCCESS' "$GATEWAY"
          grep -q 'RP_FALLBACK_START' "$GATEWAY"
          grep -q 'dynamic_route=same_endpoint_first_and_only' "$GATEWAY"
          grep -q 'STRICT_UDID_QUERY_SUCCESS' "$GATEWAY"
          grep -q 'let resolvedBackend: GatewayBackend = .idevice' "$API"
          test "$(grep -c 'tunnel_create_usb(' "$GATEWAY")" -eq 1
          test "$(grep -c 'tunnel_create_rppairing(' "$GATEWAY")" -eq 1
          ! grep -E 'lockdownd_pair\(|PAIR_REQUEST_START|DYNAMIC_CANDIDATES|SS-V11-CLEAN-RP|SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT' "$GATEWAY" "$API"
          ! grep -E 'Unable to set UDP timeout|Rebinding to socket|EMP-NAT46|EMP-HAIRPIN' em_proxy/src/lib.rs

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v12-preflight-report
          path: /tmp/v12-local-tests.txt
          if-no-files-found: error

  build:
    name: Build and verify SideStore v12 IPA
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout v12 builder branch
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout exact SideStore with pinned submodules
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          submodules: recursive
          fetch-depth: 0
          path: SideStore

      - name: Checkout exact EMProxy
        uses: actions/checkout@v4
        with:
          repository: SideStore/em_proxy
          ref: ${{ env.EMPROXY_REF }}
          path: em_proxy

      - name: Verify exact minimuxer submodule
        working-directory: SideStore
        run: |
          set -euo pipefail
          actual="$(git -C Dependencies/minimuxer rev-parse HEAD)"
          echo "minimuxer=$actual"
          test "$actual" = "$MINIMUXER_REF"

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Build fixed EMProxy for arm64 iOS
        working-directory: em_proxy
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          python3 ../builder/scripts/apply_emproxy_diag.py src/lib.rs
          grep -q 'EMP-NONBLOCK' src/lib.rs
          ! grep -E 'Unable to set UDP timeout|Rebinding to socket|EMP-NAT46|EMP-HAIRPIN' src/lib.rs

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            cargo build --release --locked --target aarch64-apple-ios

          test -f target/aarch64-apple-ios/release/libem_proxy.a
          rm -rf libs/EMProxy.xcframework
          mkdir -p libs
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libem_proxy.a \
            -headers include \
            -output libs/EMProxy.xcframework

      - name: Inject fixed EMProxy and apply v12 hybrid transport
        run: |
          set -euo pipefail
          MUX="SideStore/Dependencies/minimuxer"
          LOCAL="$MUX/LocalBinary"
          rm -rf "$LOCAL/EMProxy.xcframework"
          mkdir -p "$LOCAL"
          cp -R em_proxy/libs/EMProxy.xcframework "$LOCAL/EMProxy.xcframework"

          python3 builder/scripts/patch_v12_hybrid_backend.py "$MUX/Sources/MinimuxerApi.swift"
          python3 builder/scripts/patch_v12_hybrid_idevice.py "$MUX/DeviceGateway/idevice/IdeviceGateway.swift"
          python3 builder/scripts/patch_v12_packages.py "$MUX"
          python3 builder/scripts/apply_v12_boot_transport_fix.py SideStore/SideStore/AppBootManager.swift
          python3 builder/scripts/apply_background_auth_gate.py \
            SideStore/SideStore/Core/Operations/StandaloneOperations/BackgroundRefreshAppsOperation.swift

      - name: Compile and architecture checks before SwiftPM
        run: |
          set -euo pipefail
          MUX="SideStore/Dependencies/minimuxer"
          GATEWAY="$MUX/DeviceGateway/idevice/IdeviceGateway.swift"
          API="$MUX/Sources/MinimuxerApi.swift"

          swiftc -frontend -parse "$GATEWAY"
          swiftc -frontend -parse "$API"
          swiftc -frontend -parse "$MUX/Sources/Services/NetworkObserverService.swift"
          swiftc -frontend -parse SideStore/SideStore/AppBootManager.swift

          grep -q 'HYBRID_FILE has_rp=' "$GATEWAY"
          grep -q 'LOCKDOWN_PAIRING_PARSE_SUCCESS' "$GATEWAY"
          grep -q 'LOCKDOWN_PROVIDER_CREATE_SUCCESS' "$GATEWAY"
          grep -q 'LOCKDOWN_SESSION_AND_COREDEVICE_START' "$GATEWAY"
          grep -q 'COREDEVICE_TUNNEL_SUCCESS' "$GATEWAY"
          grep -q 'RP_FALLBACK_START' "$GATEWAY"
          grep -q 'dynamic_route=same_endpoint_first_and_only' "$GATEWAY"
          grep -q 'STRICT_UDID_QUERY_SUCCESS' "$GATEWAY"
          grep -q 'let resolvedBackend: GatewayBackend = .idevice' "$API"
          grep -q 'path: "LocalBinary/EMProxy.xcframework"' "$MUX/Package.swift"
          grep -q 'v0.1.66-ss-61c2704' "$MUX/DeviceGateway/Package.swift"
          test -d "$MUX/LocalBinary/EMProxy.xcframework"

          test "$(grep -c 'tunnel_create_usb(' "$GATEWAY")" -eq 1
          test "$(grep -c 'tunnel_create_rppairing(' "$GATEWAY")" -eq 1
          ! grep -E 'lockdownd_pair\(|PAIR_REQUEST_START|DYNAMIC_CANDIDATES|SS-V11-CLEAN-RP|SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT|SS-SOURCE-BOUND' "$GATEWAY" "$API"
          ! grep -E 'LocalBinary/IDevice\.xcframework' "$MUX/DeviceGateway/Package.swift"

      - name: Resolve Swift packages with clean retry
        working-directory: SideStore
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm"
            if xcodebuild -resolvePackageDependencies -project AltStore.xcodeproj -scheme SideStore; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Build SideStore v12
        working-directory: SideStore
        run: |
          set -euo pipefail
          python3 scripts/ci/workflow.py build

      - name: Verify IPA structure and embedded architecture
        run: |
          set -euo pipefail
          IPA="SideStore/SideStore.ipa"
          test -f "$IPA"
          unzip -t "$IPA" >/tmp/v12-unzip-test.txt
          rm -rf /tmp/v12-ipa
          mkdir -p /tmp/v12-ipa
          unzip -q "$IPA" -d /tmp/v12-ipa
          test -d /tmp/v12-ipa/Payload/SideStore.app

          find /tmp/v12-ipa/Payload/SideStore.app -type f -size +32k -print0 \
            | xargs -0 strings > /tmp/v12-embedded-strings.txt

          for marker in \
            '[SS-V12-HYBRID] HYBRID_FILE' \
            '[SS-V12-HYBRID] LOCKDOWN_SESSION_AND_COREDEVICE_START' \
            '[SS-V12-HYBRID] COREDEVICE_TUNNEL_SUCCESS' \
            '[SS-V12-HYBRID] RP_FALLBACK_START' \
            '[SS-V12-HYBRID] STRICT_UDID_QUERY_SUCCESS' \
            '[EMP-NONBLOCK] UDP socket nonblocking mode enabled'; do
            grep -Fq "$marker" /tmp/v12-embedded-strings.txt
          done

          ! grep -E 'SS-V11-CLEAN-RP|SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT|EMP-NAT46|EMP-HAIRPIN' /tmp/v12-embedded-strings.txt
          find /tmp/v12-ipa/Payload/SideStore.app -iname '*IdeviceGateway*' -print | tee /tmp/v12-frameworks.txt
          grep -q 'IdeviceGateway' /tmp/v12-frameworks.txt

          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          SIZE="$(stat -f '%z' "$IPA")"
          {
            echo "SideStore v12 Hybrid CoreDeviceProxy"
            echo "builder_commit=$GITHUB_SHA"
            echo "sidestore_ref=$SIDESTORE_REF"
            echo "minimuxer_ref=$MINIMUXER_REF"
            echo "idevice_contract_ref=$IDEVICE_REF"
            echo "emproxy_ref=$EMPROXY_REF"
            echo "ipa_size=$SIZE"
            echo "ipa_sha256=$SHA"
            echo "verification=PASS"
          } | tee /tmp/SideStore-v12-verification.txt

      - name: Upload SideStore v12 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v12-hybrid-coredevice
          path: |
            SideStore/SideStore.ipa
            /tmp/SideStore-v12-verification.txt
          if-no-files-found: error

      - name: Upload v12 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v12-build-diagnostics
          path: |
            SideStore/build/logs
            /tmp/v12-unzip-test.txt
            /tmp/v12-frameworks.txt
          if-no-files-found: ignore
