name: Trigger Adaptive Diagnostic Build Once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch adaptive diagnostic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run adaptive.yml --repo "$GITHUB_REPOSITORY" --ref main
