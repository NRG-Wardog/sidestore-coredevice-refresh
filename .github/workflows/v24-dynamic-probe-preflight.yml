name: V24 Dynamic Port Probe Preflight

on:
  workflow_dispatch:
  push:
    branches: [v24-dynamic-port-probe]
    paths:
      - ".github/v24-preflight-trigger"

permissions:
  contents: read

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: SideStore/minimuxer
          ref: ${{ env.MINIMUXER_REF }}
          path: minimuxer
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          path: SideStore
          fetch-depth: 1
          submodules: false

      - name: Verify exact pins and patch syntax
        run: |
          set -euo pipefail
          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          test "$(git -C minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C SideStore rev-parse HEAD)" = "$SIDESTORE_REF"
          python3 -m py_compile \
            builder/scripts/patch_v13_idevice_protocol.py \
            builder/scripts/patch_v21_adaptive_coredevice.py \
            builder/scripts/patch_v22_rpfirst_delta.py \
            builder/scripts/patch_v23_rp_dynamic_diag.py \
            builder/scripts/patch_v23_gateway_diag.py \
            builder/scripts/patch_v23_boot_udid_diag.py \
            builder/scripts/patch_v24_dynamic_port_probe.py

      - name: Apply V13 V23 V24 native transport patches
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_v13_idevice_protocol.py idevice
          python3 builder/scripts/patch_v23_rp_dynamic_diag.py idevice
          python3 builder/scripts/patch_v24_dynamic_port_probe.py idevice
          python3 builder/scripts/patch_v24_dynamic_port_probe.py idevice
          T=idevice/ffi/src/tunnel_provider.rs
          R=idevice/idevice/src/remote_pairing/mod.rs
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_PLAN' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_START' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_TCP_PASS' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_TCP_FAIL' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_SELECTED' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_EXHAUSTED' "$T"
          grep -Fq '[SS-V24-RPPROBE] CREATE_LISTENER_META' "$R"
          grep -Fq 'peer-reflection' "$T"
          grep -Fq 'local-utun-route-source' "$T"
          grep -Fq 'loopback' "$T"
          grep -Fq 'default-route-local' "$T"
          grep -Fq 'tokio::time::timeout' "$T"
          grep -Fq 'connect_tls_psk_tunnel_native(tunnel_stream, rpc.encryption_key())' "$T"
          grep -Fq '[SS-V13-IDEVICE] LOCKDOWN_QUERY_TYPE_START' "$T"
          cargo check --locked --manifest-path idevice/ffi/Cargo.toml --features obfuscate

      - name: Apply V21 V22 V23 gateway route and parse Swift
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_v21_adaptive_coredevice.py minimuxer
          python3 builder/scripts/patch_v22_rpfirst_delta.py minimuxer
          python3 builder/scripts/patch_v23_gateway_diag.py minimuxer
          G=minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          swiftc -frontend -parse "$G"
          swiftc -frontend -parse minimuxer/DeviceGateway/PairingProtocol.swift
          grep -Fq '[SS-V23-RPDIAG] TUNNEL_LOCK_WAIT' "$G"
          grep -Fq '[SS-V23-RPDIAG] TUNNEL_LOCK_ACQUIRED' "$G"
          grep -Fq '[SS-V22-RPFIRST] composite route=stock-rppairing-first coredevice-fallback' "$G"

      - name: Apply nil-UDID diagnostic fix and parse
        run: |
          set -euo pipefail
          python3 builder/scripts/patch_v23_boot_udid_diag.py SideStore/SideStore/AppBootManager.swift
          swiftc -frontend -parse SideStore/SideStore/AppBootManager.swift
          grep -Fq '[SS-V23-RPDIAG] NIL_UDID_TRANSPORT_FAIL' SideStore/SideStore/AppBootManager.swift

      - name: Architecture barriers
        run: |
          set -euo pipefail
          T=idevice/ffi/src/tunnel_provider.rs
          G=minimuxer/DeviceGateway/idevice/IdeviceGateway.swift
          ! grep -R -Eq 'EMP-NAT44|EMP-TRANSIT|ipsec-first|v14-rp-protocol-matrix' minimuxer/Sources minimuxer/DeviceGateway
          ! grep -E '\[SS-V24-RPPROBE\].*(private_key|public_key|HostPrivateKey|RootPrivateKey|DeviceCertificate|HostCertificate)' "$T" idevice/idevice/src/remote_pairing/mod.rs
          printf '%s\n' \
            'V24 preflight PASS' \
            'listener_port=device-returned only' \
            'probe_order=peer-reflection,local-utun-route-source,loopback,default-route-local' \
            'per_candidate_timeout_ms=2000' \
            'first_tcp_pass=selected then stock TLS-PSK/CDTunnel/RSD' \
            'nat44=disabled' \
            'custom_tls=disabled' \
            'tunnel_creation=serialized' | tee /tmp/v24-preflight.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-v24-preflight
          path: /tmp/v24-preflight.txt
          retention-days: 3
