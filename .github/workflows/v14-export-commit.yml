name: Commit v14 artifact coordinates

on:
  push:
    branches: [v14-protocol-matrix]
    paths:
      - ".github/v14-export-commit-trigger"

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v14-protocol-matrix
          fetch-depth: 0
      - name: Commit exact run and artifact coordinates
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c5ac14f7c2788976ca481c154b771a1f144ad86b
        run: |
          set -euo pipefail
          runs_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/v14-protocol-matrix.yml/runs" \
            -f branch=v14-protocol-matrix \
            -f per_page=20)"
          run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$runs_json" | head -1)"
          status="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$runs_json" | head -1)"
          conclusion="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | (.conclusion // "none")' <<<"$runs_json" | head -1)"
          artifact_id="none"
          if [[ -n "$run_id" && "$status" == "completed" && "$conclusion" == "success" ]]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "SideStore-v14-protocol-matrix") | .id' | head -1)"
          fi
          mkdir -p build-results
          result="build-results/V14_RUN_${run_id:-missing}_ARTIFACT_${artifact_id:-missing}_${status:-missing}_${conclusion:-missing}.txt"
          printf 'TARGET_SHA=%s\nRUN_ID=%s\nARTIFACT_ID=%s\nSTATUS=%s\nCONCLUSION=%s\n' \
            "$TARGET_SHA" "$run_id" "$artifact_id" "$status" "$conclusion" > "$result"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result"
          git commit -m "V14_ARTIFACT run_${run_id:-missing} artifact_${artifact_id:-missing} status_${status:-missing} conclusion_${conclusion:-missing}"
          git push origin HEAD:v14-protocol-matrix
