name: Publish verified v14 protocol matrix IPA

on:
  workflow_dispatch:
  push:
    branches: [v14-protocol-matrix]
    paths:
      - ".github/v14-publish-trigger"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: c5ac14f7c2788976ca481c154b771a1f144ad86b
      TARGET_WORKFLOW: v14-protocol-matrix.yml
      RELEASE_TAG: v14-protocol-matrix-build3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v14-protocol-matrix

      - name: Resolve successful exact-head build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            runs_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch=v14-protocol-matrix -f per_page=30)"
            run_id="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$runs_json" | head -1)"
            status="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .status' <<<"$runs_json" | head -1)"
            conclusion="$(jq -r --arg sha "$TARGET_SHA" '.workflow_runs[] | select(.head_sha == $sha) | (.conclusion // "")' <<<"$runs_json" | head -1)"
            echo "attempt=$attempt run_id=$run_id status=$status conclusion=$conclusion"
            if [[ -n "$run_id" && "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Exact-head build failed: $conclusion"; exit 1; }
              echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for exact-head v14 build" >&2
          exit 1

      - name: Download and verify v14 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifact extracted release
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")"
          artifact_id="$(jq -r '.artifacts[] | select(.name == "SideStore-v14-protocol-matrix") | .id' <<<"$artifacts_json" | head -1)"
          artifact_digest="$(jq -r '.artifacts[] | select(.name == "SideStore-v14-protocol-matrix") | (.digest // "")' <<<"$artifacts_json" | head -1)"
          [[ -n "$artifact_id" && "$artifact_id" != "null" ]] || { echo "Main artifact missing"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > artifact/v14.zip
          unzip -q artifact/v14.zip -d extracted
          ipa="$(find extracted -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]] || { echo "IPA missing from artifact"; exit 1; }
          unzip -t "$ipa" >/tmp/v14-release-unzip.txt
          rm -rf /tmp/v14-release-payload
          mkdir -p /tmp/v14-release-payload
          unzip -q "$ipa" -d /tmp/v14-release-payload
          test -d /tmp/v14-release-payload/Payload/SideStore.app
          find /tmp/v14-release-payload/Payload/SideStore.app -type f -size +32k -print0 | xargs -0 strings > /tmp/v14-release-strings.txt
          for marker in \
            '[SS-V14-MATRIX]' \
            '[SS-V14-CONNECT-ASYNC]' \
            'CANDIDATE_TIMEOUT' \
            'PAIRING_PASS' \
            'LISTENER_PASS' \
            'DYNAMIC_CONNECT_PASS' \
            'RSD_PASS' \
            '[SS-V14-READY] SIGNER_PASS' \
            'FLAG: READY_TO_AUTOMATION'; do
            grep -Fq "$marker" /tmp/v14-release-strings.txt || { echo "Missing marker: $marker"; exit 1; }
          done
          test "$(grep -Fc 'FLAG: READY_TO_AUTOMATION' /tmp/v14-release-strings.txt)" -eq 1
          ! grep -E 'EMP-V13-HAIRPIN|EMP-NAT46|SS-V10-LOCKDOWN-BOOTSTRAP|SS-V9-COREDEVICE|SS-ADAPT' /tmp/v14-release-strings.txt
          cp "$ipa" release/SideStore-v14-protocol-matrix-final.ipa
          sha256sum release/SideStore-v14-protocol-matrix-final.ipa > release/SideStore-v14-protocol-matrix-final.sha256
          verification="$(find extracted -type f -iname '*verification*.txt' -print -quit)"
          if [[ -n "$verification" ]]; then cp "$verification" release/V14_VERIFICATION_REPORT.txt; fi
          {
            echo "TARGET_SHA=$TARGET_SHA"
            echo "RUN_ID=$RUN_ID"
            echo "ARTIFACT_ID=$artifact_id"
            echo "ARTIFACT_DIGEST=$artifact_digest"
            echo "IPA_SHA256=$(sha256sum release/SideStore-v14-protocol-matrix-final.ipa | awk '{print $1}')"
            echo "MARKER_COUNT_READY=$(grep -Fc 'FLAG: READY_TO_AUTOMATION' /tmp/v14-release-strings.txt)"
            echo "ZIP_TEST=PASS"
            echo "PAYLOAD_TEST=PASS"
            echo "BINARY_MARKERS=PASS"
          } > release/V14_RELEASE_EVIDENCE.txt
          cp artifact/v14.zip release/SideStore-v14-original-artifact.zip
          (cd release && zip -q SideStore-v14-complete-package.zip SideStore-v14-protocol-matrix-final.ipa SideStore-v14-protocol-matrix-final.sha256 V14_RELEASE_EVIDENCE.txt $(test -f V14_VERIFICATION_REPORT.txt && echo V14_VERIFICATION_REPORT.txt))

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$TARGET_SHA" \
              --title "SideStore v14 Protocol Matrix Build 3" \
              --notes "Preflight-gated v14 protocol matrix with nonblocking native connects, per-candidate deadlines, fresh PairVerify/listener per route, exact binary-marker verification, and a signer-success-only READY_TO_AUTOMATION flag. Runtime success still requires validation on the target iPhone."
          fi
