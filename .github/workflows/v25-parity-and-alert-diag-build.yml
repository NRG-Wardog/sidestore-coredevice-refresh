name: Build SideStore V25 Parity and Alert Diag

on:
  workflow_dispatch:
  push:
    branches: [v25-local-origin-tls-alert]
    paths:
      - ".github/v25-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v25-parity-and-alert-diag-final
  cancel-in-progress: false

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout V25 builder
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1

      - name: Checkout pinned SideStore
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          path: work/SideStore
          fetch-depth: 1
          submodules: recursive

      - name: Checkout pinned IDevice
        uses: actions/checkout@v4
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_REF }}
          path: idevice
          fetch-depth: 1
          submodules: recursive

      - name: Verify exact pins and patch syntax
        run: |
          set -euo pipefail
          test "$(git -C work/SideStore rev-parse HEAD)" = "$SIDESTORE_REF"
          test "$(git -C work/SideStore/Dependencies/minimuxer rev-parse HEAD)" = "$MINIMUXER_REF"
          test "$(git -C idevice rev-parse HEAD)" = "$IDEVICE_REF"
          python3 -m py_compile \
            builder/scripts/patch_v13_idevice_protocol.py \
            builder/scripts/patch_v21_adaptive_coredevice.py \
            builder/scripts/patch_v22_rpfirst_delta.py \
            builder/scripts/patch_v22_local_idevice_package.py \
            builder/scripts/patch_v23_rp_dynamic_diag.py \
            builder/scripts/patch_v23_gateway_diag.py \
            builder/scripts/patch_v23_boot_udid_diag.py \
            builder/scripts/patch_v24_dynamic_port_probe.py \
            builder/scripts/patch_v25_parity_and_alert_diag.py

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Restore build caches only
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/bindgen
            idevice/target
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: sidestore-v25-parity-${{ runner.os }}-${{ env.IDEVICE_REF }}-${{ env.MINIMUXER_REF }}
          restore-keys: |
            sidestore-v24-rpprobe-
            sidestore-v23-rpdiag-
            sidestore-v22-final-
            sidestore-v13-macos26-arm64-
            sidestore-v21-adaptive-spm-
            sidestore-

      - name: Ensure minimal build tools
        run: |
          set -euo pipefail
          if ! command -v ldid >/dev/null 2>&1; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid; fi
          if ! command -v bindgen >/dev/null 2>&1; then cargo install --locked bindgen-cli --version 0.72.1; fi
          rustup target add aarch64-apple-ios

      - name: Build V25 diagnostic IDevice arm64 XCFramework
        working-directory: idevice
        run: |
          set -euo pipefail
          python3 ../builder/scripts/patch_v13_idevice_protocol.py .
          python3 ../builder/scripts/patch_v23_rp_dynamic_diag.py .
          python3 ../builder/scripts/patch_v24_dynamic_port_probe.py .
          python3 ../builder/scripts/patch_v25_parity_and_alert_diag.py .
          T=ffi/src/tunnel_provider.rs
          R=idevice/src/remote_pairing/mod.rs
          P=idevice/src/remote_pairing/tls_psk.rs
          U=idevice/src/remote_pairing/tunnel.rs
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_PLAN' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_START' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_TCP_PASS' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_TCP_FAIL' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_SELECTED' "$T"
          grep -Fq '[SS-V24-RPPROBE] V24_PROBE_EXHAUSTED' "$T"
          grep -Fq '[SS-V24-RPPROBE] CREATE_LISTENER_META' "$R"
          grep -Fq '[SS-V25-RP] CREATE_LISTENER_PEER_INFO_SENT' "$R"
          grep -Fq '[SS-V25-TLS] SERVER_FINISHED_PASS' "$P"
          grep -Fq '[SS-V25-TLS] SERVER_FINISHED_FATAL' "$P"
          grep -Fq '[SS-V25-ALERT] TLS_ALERT' "$P"
          grep -Fq '[SS-V25-CDT] HANDSHAKE_START' "$U"
          grep -Fq '[SS-V25-CDT] REQUEST_WRITE_PASS' "$U"
          grep -Fq '[SS-V25-CDT] HANDSHAKE_PASS' "$U"
          grep -Fq '[SS-V23-RPDIAG] RP_CONTROL_CONNECT_START' "$T"
          grep -Fq '[SS-V23-RPDIAG] RP_TLS_PSK_START' "$T"
          grep -Fq '[SS-V23-RPDIAG] RP_RSD_HANDSHAKE_PASS' "$T"
          grep -Fq '[SS-V13-IDEVICE] LOCKDOWN_QUERY_TYPE_START' "$T"

          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            cargo build --release --locked --target aarch64-apple-ios \
              --features obfuscate --manifest-path ffi/Cargo.toml

          test -f target/aarch64-apple-ios/release/libidevice_ffi.a
          test -f ffi/idevice.h
          rm -rf swift/IDevice.xcframework
          cp ffi/idevice.h swift/include/idevice.h
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libidevice_ffi.a \
            -headers swift/include \
            -output swift/IDevice.xcframework
          test -d swift/IDevice.xcframework

      - name: Inject V25 route and existing serialization diagnostics
        run: |
          set -euo pipefail
          MUX=work/SideStore/Dependencies/minimuxer
          mkdir -p "$MUX/DeviceGateway/LocalBinary"
          rm -rf "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"
          cp -R idevice/swift/IDevice.xcframework "$MUX/DeviceGateway/LocalBinary/IDevice.xcframework"

          python3 builder/scripts/patch_v21_adaptive_coredevice.py "$MUX"
          python3 builder/scripts/patch_v22_rpfirst_delta.py "$MUX"
          python3 builder/scripts/patch_v23_gateway_diag.py "$MUX"
          python3 builder/scripts/patch_v22_local_idevice_package.py "$MUX"
          python3 builder/scripts/patch_v23_boot_udid_diag.py work/SideStore/SideStore/AppBootManager.swift

          G="$MUX/DeviceGateway/idevice/IdeviceGateway.swift"
          swiftc -frontend -parse "$G"
          swiftc -frontend -parse "$MUX/DeviceGateway/PairingProtocol.swift"
          swiftc -frontend -parse "$MUX/Sources/Services/NetworkObserverService.swift"
          swiftc -frontend -parse work/SideStore/SideStore/AppBootManager.swift

          grep -Fq '[SS-V23-RPDIAG] TUNNEL_LOCK_WAIT' "$G"
          grep -Fq '[SS-V23-RPDIAG] TUNNEL_LOCK_ACQUIRED' "$G"
          grep -Fq '[SS-V22-RPFIRST] composite route=stock-rppairing-first coredevice-fallback' "$G"
          grep -Fq '[SS-V23-RPDIAG] NIL_UDID_TRANSPORT_FAIL' work/SideStore/SideStore/AppBootManager.swift
          grep -Fq 'path: "LocalBinary/IDevice.xcframework"' "$MUX/DeviceGateway/Package.swift"
          ! grep -R -Eq 'EMP-NAT44|EMP-TRANSIT|ipsec-first|v14-rp-protocol-matrix' "$MUX/Sources" "$MUX/DeviceGateway"

      - name: Resolve SwiftPM deterministically
        working-directory: work/SideStore
        run: |
          set -euo pipefail
          artifact="$HOME/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$artifact"
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages/artifacts/openssl 2>/dev/null || true
            if xcodebuild -resolvePackageDependencies -disablePackageRepositoryCache -project AltStore.xcodeproj -scheme SideStore; then ok=1; break; fi
            test "$attempt" -lt 3
            sleep 2
          done
          test "$ok" -eq 1

      - name: Build SideStore V25 exactly once
        working-directory: work/SideStore
        run: |
          set -euo pipefail
          mkdir -p build/logs
          NSUnbufferedIO=YES make -B build 2>&1 | tee build/logs/build.log
          make fakesign 2>&1 | tee -a build/logs/build.log
          make ipa 2>&1 | tee -a build/logs/build.log

      - name: Verify final V25 IPA
        run: |
          set -euo pipefail
          IPA=work/SideStore/SideStore.ipa
          test -f "$IPA"
          unzip -t "$IPA" >/tmp/v25-unzip-test.txt
          rm -rf /tmp/v25-ipa && mkdir -p /tmp/v25-ipa
          unzip -q "$IPA" -d /tmp/v25-ipa
          find /tmp/v25-ipa/Payload/SideStore.app -type f -size +32k -print0 | xargs -0 strings >/tmp/v25-strings.txt

          for marker in \
            '[SS-V24-RPPROBE] V24_PROBE_PLAN' \
            '[SS-V24-RPPROBE] V24_PROBE_START' \
            '[SS-V24-RPPROBE] V24_PROBE_TCP_PASS' \
            '[SS-V24-RPPROBE] V24_PROBE_TCP_FAIL' \
            '[SS-V24-RPPROBE] V24_PROBE_SELECTED' \
            '[SS-V24-RPPROBE] V24_PROBE_EXHAUSTED' \
            '[SS-V24-RPPROBE] CREATE_LISTENER_META' \
            '[SS-V25-RP] CREATE_LISTENER_PEER_INFO_SENT' \
            '[SS-V25-TLS] SERVER_FINISHED_PASS' \
            '[SS-V25-TLS] SERVER_FINISHED_FATAL' \
            '[SS-V25-ALERT] TLS_ALERT' \
            '[SS-V25-CDT] HANDSHAKE_START' \
            '[SS-V25-CDT] REQUEST_WRITE_PASS' \
            '[SS-V25-CDT] HANDSHAKE_PASS' \
            '[SS-V23-RPDIAG] RP_CONTROL_CONNECT_START' \
            '[SS-V23-RPDIAG] RP_PAIRING_PASS' \
            '[SS-V23-RPDIAG] RP_CREATE_LISTENER_PASS' \
            '[SS-V23-RPDIAG] RP_TLS_PSK_START' \
            '[SS-V23-RPDIAG] RP_TUNNEL_INFO' \
            '[SS-V23-RPDIAG] RP_RSD_HANDSHAKE_PASS' \
            '[SS-V23-RPDIAG] TUNNEL_LOCK_WAIT' \
            '[SS-V23-RPDIAG] NIL_UDID_TRANSPORT_FAIL' \
            '[SS-V13-IDEVICE] LOCKDOWN_QUERY_TYPE_START' \
            '[SS-V13-IDEVICE] LOCKDOWN_FRAME_WRITE'; do
            grep -Fq "$marker" /tmp/v25-strings.txt
          done

          grep -Fq 'peer-reflection' /tmp/v25-strings.txt
          grep -Fq 'local-utun-route-source' /tmp/v25-strings.txt
          grep -Fq 'default-route-local' /tmp/v25-strings.txt
          grep -Fq 'tunnel_create_rppairing' /tmp/v25-strings.txt
          grep -Fq 'tunnel_create_usb' /tmp/v25-strings.txt
          ! grep -Eq 'EMP-NAT44|EMP-TRANSIT|v14-rp-protocol-matrix' /tmp/v25-strings.txt

          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          SIZE="$(stat -f '%z' "$IPA")"
          {
            echo 'SideStore V25 Parity and Alert Diag'
            echo "builder_commit=$GITHUB_SHA"
            echo "sidestore_ref=$SIDESTORE_REF"
            echo "minimuxer_ref=$MINIMUXER_REF"
            echo "idevice_ref=$IDEVICE_REF"
            echo "ipa_size=$SIZE"
            echo "ipa_sha256=$SHA"
            echo 'exact_pymobiledevice3_cdtunnel_parity=true (58 bytes)'
            echo 'strict_server_finished_verification=true'
            echo 'explicit_tls_alert_decoding=true'
            echo 'create_listener_peer_connections_info=true'
            echo 'fragmented_tls_response_accumulation=true'
            echo 'probe_order=peer-reflection,local-utun-route-source,loopback,default-route-local'
            echo 'probe_timeout_ms=2000'
            echo 'tunnel_creation=serialized'
            echo 'fallback=v13-querytype-coredevice'
            echo 'verification=PASS'
          } | tee /tmp/v25-verification.txt

      - name: Upload verified V25 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v25-parity-and-alert-diag
          path: |
            work/SideStore/SideStore.ipa
            /tmp/v25-verification.txt
            /tmp/v25-unzip-test.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload V25 failure diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v25-failure-diagnostics
          path: |
            work/SideStore/build/logs
            /tmp/v25-verification.txt
            /tmp/v25-unzip-test.txt
            /tmp/v25-strings.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
