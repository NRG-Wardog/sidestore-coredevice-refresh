name: Build SideStore v16 EMProxy Rebind

on:
  workflow_dispatch:
  push:
    branches: [v16-emproxy-rebind]
    paths:
      - ".github/v16-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v16-emproxy-rebind
  cancel-in-progress: false

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: 7b9d269ec64027d73a50faa917cb18fa218c1fc9

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
      - name: Verify recovery patch syntax
        run: |
          python3 -m py_compile builder/scripts/apply_emproxy_rebind_recovery.py
          grep -Fq '[EMP-RECOVER] ENOTCONN detected; rebinding UDP socket' builder/scripts/apply_emproxy_rebind_recovery.py
          grep -Fq '[EMP-RECOVER] UDP socket rebound after ENOTCONN' builder/scripts/apply_emproxy_rebind_recovery.py
          grep -Fq 'raw_os_error() == Some(57)' builder/scripts/apply_emproxy_rebind_recovery.py
      - name: Verify pinned RemotePairingKit product graph
        run: |
          curl -fsSL "https://raw.githubusercontent.com/mahee96/RemotePairingKit/${RPK_REF}/Package.swift" -o /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "RPPairing"' /tmp/RemotePairingKit.Package.swift
          grep -Fq 'name: "OpenSSL"' /tmp/RemotePairingKit.Package.swift
      - name: Build v16 CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v16_ci.sh
          bash -n /tmp/v16_ci.sh
      - name: Run Linux source, Rust, Swift and privacy barriers
        env:
          MODE: preflight
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v16_ci.sh
          bash /tmp/v16_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-v16-preflight
          path: /tmp/v14-local-tests.txt
          if-no-files-found: error

  build:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Build v16 CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v16_ci.sh
          bash -n /tmp/v16_ci.sh
      - name: Build native libraries and SideStore v16 IPA
        env:
          MODE: build
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v16_ci.sh
          bash /tmp/v16_ci.sh
          grep -Fq '[EMP-RECOVER] ENOTCONN detected; rebinding UDP socket' /tmp/v14-embedded-strings.txt
          grep -Fq '[EMP-RECOVER] UDP socket rebound after ENOTCONN' /tmp/v14-embedded-strings.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-v16-emproxy-rebind
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/SideStore.ipa
            /tmp/SideStore-v14-verification.txt
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v16-build-diagnostics
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/build/logs
            /tmp/v14-unzip-test.txt
            /tmp/v14-embedded-strings.txt
          if-no-files-found: ignore
