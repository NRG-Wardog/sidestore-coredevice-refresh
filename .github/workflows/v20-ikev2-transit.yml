name: Build SideStore v20 IKEv2 First Transit

on:
  workflow_dispatch:
  push:
    branches: [v20-ikev2-transit]
    paths:
      - ".github/v20-build-trigger"

permissions:
  contents: read

concurrency:
  group: sidestore-v20-ikev2-transit
  cancel-in-progress: true

env:
  SIDESTORE_REF: 3dc127ee6f17aa20f0863becd07c0c6043d8dddd
  MINIMUXER_REF: ef8a54ccbd08a0b679a556df20121c1e7e13be7e
  IDEVICE_REF: 61c27041f8d3d0be4cc3e046ee04501649c9d66e
  EMPROXY_REF: 6e117e140ca7cff4ff106bdefa18147552a0e592
  RPK_REF: 7b9d269ec64027d73a50faa917cb18fa218c1fc9

jobs:
  preflight:
    name: ikev2-transit-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - name: Validate generators, selector and NAT44 packet model
        run: |
          python3 -m py_compile \
            builder/scripts/patch_v15_ci_inject.py \
            builder/scripts/patch_v18_ci_inject.py \
            builder/scripts/patch_v18_full_pipeline.py \
            builder/scripts/patch_v20_ci_inject.py \
            builder/scripts/apply_emproxy_nat44_dynamic.py \
            builder/scripts/apply_emproxy_ikev2_transit.py \
            builder/tests/test_nat44_packet_model.py

          python3 builder/tests/test_nat44_packet_model.py

          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          python3 builder/scripts/patch_v20_ci_inject.py /tmp/v18_ci.sh /tmp/v20_ci.sh
          bash -n /tmp/v20_ci.sh

          ! grep -Fq 'cargo install --locked bindgen-cli' /tmp/v20_ci.sh
          grep -Fq '[EMP-NAT44] dynamic listener bridge active' builder/scripts/apply_emproxy_nat44_dynamic.py
          grep -Fq '[EMP-TRANSIT] selected interface=' builder/scripts/apply_emproxy_ikev2_transit.py
          grep -Fq 'transit=ipsec-first,en0-fallback' builder/scripts/apply_emproxy_ikev2_transit.py
          grep -Fq 'fn nat44_transit_ipv4' builder/scripts/apply_emproxy_ikev2_transit.py
          grep -Fq 'name.starts_with("ipsec")' builder/scripts/apply_emproxy_ikev2_transit.py

      - name: Apply patch chain and compile changed EMProxy crate
        run: |
          ROOT="${RUNNER_TEMP}/sidestore-v20-emproxy-preflight"
          rm -rf "$ROOT"
          git init -q "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/SideStore/em_proxy.git
          git -C "$ROOT" fetch -q --depth=1 origin "$EMPROXY_REF"
          git -C "$ROOT" checkout -q --detach FETCH_HEAD
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$EMPROXY_REF"

          python3 builder/scripts/apply_emproxy_diag.py "$ROOT/src/lib.rs"
          python3 builder/scripts/patch_v13_emproxy_payload_diag.py "$ROOT/src/lib.rs"
          python3 builder/scripts/apply_emproxy_nat44_dynamic.py "$ROOT/src/lib.rs"
          python3 builder/scripts/apply_emproxy_ikev2_transit.py "$ROOT/src/lib.rs"
          python3 builder/scripts/apply_emproxy_ikev2_transit.py "$ROOT/src/lib.rs"

          grep -Fq '[EMP-NAT44] dynamic listener bridge active' "$ROOT/src/lib.rs"
          grep -Fq '[EMP-TRANSIT] selected interface=' "$ROOT/src/lib.rs"
          grep -Fq 'transit=ipsec-first,en0-fallback' "$ROOT/src/lib.rs"
          grep -Fq 'nat44_transit_ipv4' "$ROOT/src/lib.rs"
          grep -Fq 'name.starts_with("ipsec")' "$ROOT/src/lib.rs"
          grep -Fq 'priority: "ikev2"' "$ROOT/src/lib.rs"
          grep -Fq 'priority: "fallback-en0"' "$ROOT/src/lib.rs"
          ! grep -Fq 'fn nat44_en0_ipv4' "$ROOT/src/lib.rs"
          ! grep -Fq 'source=en0/en*' "$ROOT/src/lib.rs"
          ! grep -Eq 'HostPrivateKey|RootPrivateKey|private_key=|certificate=|EscrowBag|encryption_key=' "$ROOT/src/lib.rs"

          CARGO_TARGET_DIR="${RUNNER_TEMP}/sidestore-v20-emproxy-target" \
            cargo check --locked --manifest-path "$ROOT/Cargo.toml" --lib

  build:
    name: one-final-macos-build
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"

      - name: Generate final v20 CI runner
        run: |
          python3 builder/scripts/patch_v15_ci_inject.py builder/scripts/v14_ci.sh /tmp/v17_ci.sh
          python3 builder/scripts/patch_v18_ci_inject.py /tmp/v17_ci.sh /tmp/v18_ci.sh
          python3 builder/scripts/patch_v20_ci_inject.py /tmp/v18_ci.sh /tmp/v20_ci.sh
          bash -n /tmp/v20_ci.sh
          ! grep -Fq 'cargo install --locked bindgen-cli' /tmp/v20_ci.sh

      - name: Build native libraries and SideStore v20 IPA
        env:
          MODE: build
        run: |
          python3 builder/scripts/patch_v14_spm_resolution.py /tmp/v20_ci.sh
          bash /tmp/v20_ci.sh

          grep -Fq '[EMP-NAT44] dynamic listener bridge active' /tmp/v14-embedded-strings.txt
          grep -Fq '[EMP-TRANSIT] selected interface=' /tmp/v14-embedded-strings.txt
          grep -Fq 'transit=ipsec-first,en0-fallback' /tmp/v14-embedded-strings.txt
          grep -Fq 'TX-NAT44-FWD' /tmp/v14-embedded-strings.txt
          grep -Fq 'TX-NAT44-REV' /tmp/v14-embedded-strings.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SideStore-v20-ikev2-transit
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/SideStore.ipa
            /tmp/SideStore-v14-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-v20-build-failure-diagnostics
          path: |
            ${{ runner.temp }}/sidestore-v14-build/SideStore/build/logs
            /tmp/v14-unzip-test.txt
            /tmp/v14-embedded-strings.txt
          if-no-files-found: ignore
          retention-days: 3
